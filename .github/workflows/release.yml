name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries-linux-windows:
    name: Build Linux + Windows binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install server dependencies
        run: npm install
        working-directory: apps/server
      - name: Bundle server
        working-directory: apps/server
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist/binaries
          npx esbuild src/index.ts --bundle --platform=node --format=cjs \
            --outfile=$GITHUB_WORKSPACE/dist/kyuu-bundle.cjs \
            "--banner:js=const _importMetaUrl=require('url').pathToFileURL(__filename).href;" \
            --define:import.meta.url=_importMetaUrl
      - name: Package binaries
        run: |
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-linux-x64 --output dist/binaries/kyuu-linux-x64
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-linux-arm64 --output dist/binaries/kyuu-linux-arm64
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-win-x64 --output dist/binaries/kyuu-windows-x64.exe
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/binaries/kyuu-linux-x64
            dist/binaries/kyuu-linux-arm64
            dist/binaries/kyuu-windows-x64.exe

  binaries-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install server dependencies
        run: npm install
        working-directory: apps/server
      - name: Bundle server
        working-directory: apps/server
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist/binaries
          npx esbuild src/index.ts --bundle --platform=node --format=cjs \
            --outfile=$GITHUB_WORKSPACE/dist/kyuu-bundle.cjs \
            "--banner:js=const _importMetaUrl=require('url').pathToFileURL(__filename).href;" \
            --define:import.meta.url=_importMetaUrl
      - name: Package and sign macOS binaries
        run: |
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-macos-arm64 --output dist/binaries/kyuu-macos-arm64
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-macos-x64 --output dist/binaries/kyuu-macos-x64
          codesign -f -s - dist/binaries/kyuu-macos-arm64
          codesign -f -s - dist/binaries/kyuu-macos-x64
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Kyuu ${{ github.ref_name }}

            ### Quick start

            Download the binary for your platform, make it executable, and run it.
            The server runs on port 3001 — point the Kyuu iOS app at your machine's IP address.

            | Platform | File |
            |----------|------|
            | Linux x64 | `kyuu-linux-x64` |
            | Linux ARM64 (Raspberry Pi) | `kyuu-linux-arm64` |
            | macOS Apple Silicon | `kyuu-macos-arm64` |
            | macOS Intel | `kyuu-macos-x64` |
            | Windows | `kyuu-windows-x64.exe` |

            **Linux / macOS:**
            ```bash
            chmod +x kyuu-macos-arm64
            ./kyuu-macos-arm64
            ```

            > **macOS note:** If you see _"damaged and can't be opened"_, run:
            > `xattr -d com.apple.quarantine ./kyuu-macos-arm64`

            **Windows:** Double-click `kyuu-windows-x64.exe`

            No Docker or Node.js required.
          files: |
            dist/binaries/kyuu-macos-arm64
            dist/binaries/kyuu-macos-x64
