name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries-linux-windows:
    name: Build Linux + Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install server dependencies
        run: npm install
        working-directory: apps/server
      - name: Bundle server
        working-directory: apps/server
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist/binaries
          npx esbuild src/index.ts --bundle --platform=node --format=cjs \
            --outfile=$GITHUB_WORKSPACE/dist/kyuu-bundle.cjs \
            "--banner:js=const _importMetaUrl=require('url').pathToFileURL(__filename).href;" \
            --define:import.meta.url=_importMetaUrl
      - name: Package Linux + Windows binaries
        run: |
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-linux-x64 --output dist/binaries/kyuu-linux-x64
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-linux-arm64 --output dist/binaries/kyuu-linux-arm64
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-win-x64 --output dist/binaries/kyuu-windows-x64.exe

  binaries-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install server dependencies
        run: npm install
        working-directory: apps/server
      - name: Bundle server
        working-directory: apps/server
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist/binaries
          npx esbuild src/index.ts --bundle --platform=node --format=cjs \
            --outfile=$GITHUB_WORKSPACE/dist/kyuu-bundle.cjs \
            "--banner:js=const _importMetaUrl=require('url').pathToFileURL(__filename).href;" \
            --define:import.meta.url=_importMetaUrl
      - name: Package and sign macOS binaries
        run: |
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-macos-arm64 --output dist/binaries/kyuu-macos-arm64
          npx @yao-pkg/pkg dist/kyuu-bundle.cjs --targets node20-macos-x64 --output dist/binaries/kyuu-macos-x64
          codesign -f -s - dist/binaries/kyuu-macos-arm64
          codesign -f -s - dist/binaries/kyuu-macos-x64
