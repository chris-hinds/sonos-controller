name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install server dependencies
        run: bun install
        working-directory: apps/server
      - name: Build Linux binaries
        run: |
          mkdir -p dist/binaries
          cd apps/server
          bun build --compile --target=bun-linux-x64 src/index.ts --outfile=../../dist/binaries/kyuu-linux-x64
          bun build --compile --target=bun-linux-arm64 src/index.ts --outfile=../../dist/binaries/kyuu-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/binaries/

  build-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install server dependencies
        run: bun install
        working-directory: apps/server
      - name: Build macOS binaries
        run: |
          mkdir -p dist/binaries
          cd apps/server
          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile=../../dist/binaries/kyuu-macos-arm64
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile=../../dist/binaries/kyuu-macos-x64
      - name: Ad-hoc sign binaries
        run: |
          codesign --sign - dist/binaries/kyuu-macos-arm64
          codesign --sign - dist/binaries/kyuu-macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/binaries/

  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install server dependencies
        run: bun install
        working-directory: apps/server
      - name: Build Windows binary
        run: |
          mkdir -Force dist/binaries
          cd apps/server
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile=../../dist/binaries/kyuu-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/binaries/

  release:
    name: Upload to release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-binaries'
          path: dist/binaries
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/binaries/*
          body: |
            ## Kyuu ${{ github.ref_name }}

            ### Quick start

            Download the binary for your platform, make it executable, and run it.
            The server runs on port 3001 — point the Kyuu iOS app at your machine's IP address.

            | Platform | File |
            |----------|------|
            | Linux x64 | `kyuu-linux-x64` |
            | Linux ARM64 (Raspberry Pi) | `kyuu-linux-arm64` |
            | macOS Apple Silicon | `kyuu-macos-arm64` |
            | macOS Intel | `kyuu-macos-x64` |
            | Windows | `kyuu-windows-x64.exe` |

            **Linux / macOS:**
            ```bash
            chmod +x kyuu-macos-arm64
            ./kyuu-macos-arm64
            ```

            > **macOS note:** If you see _"damaged and can't be opened"_, run:
            > `xattr -d com.apple.quarantine ./kyuu-macos-arm64`

            **Windows:** Double-click `kyuu-windows-x64.exe`

            No Docker or Node.js required.
